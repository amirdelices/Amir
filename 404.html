<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | مدرسة أمير</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #ff6b81;
            --primary-dark: #ff4757;
            --bg-gradient: linear-gradient(135deg, #ffe0e9 0%, #fff0f6 100%);
            --white: #ffffff;
            --text: #333;
            --muted: #666;
            --radius: 30px;
            --shadow: 0 20px 40px rgba(255, 107, 129, 0.15);
            
            --dark-bg: #1a1a1a;
            --dark-card: #2d2d2d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            transition: 0.5s;
            padding: 20px;
        }

        body.dark-mode { background: var(--dark-bg); }

        .content {
            background-color: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 3.5rem 2rem;
            text-align: center;
            transition: 0.5s;
        }

        .dark-mode .content { background-color: var(--dark-card); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        /* جعل الصورة 001.png هي الأيقونة الأساسية */
        .main-image {
            display: block;
            margin: 0 auto 25px;
            animation: float 3s ease-in-out infinite;
        }

        .main-image img {
            max-width: 200px; /* حجم مناسب للظهور كأيقونة كبيرة */
            height: auto;
            filter: drop-shadow(0 12px 12px rgba(255, 107, 129, 0.25));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .error-num {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
            line-height: 1;
        }

        h2 { color: var(--primary-dark); font-size: 1.7rem; margin-bottom: 15px; font-weight: 700; }
        p { color: var(--muted); line-height: 1.6; margin-bottom: 35px; font-size: 1.1rem; }
        .dark-mode p { color: #aaa; }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 35px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: 0.4s;
            box-shadow: 0 8px 20px rgba(255, 107, 129, 0.3);
        }

        .btn-home:hover {
            background: var(--primary-dark);
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(255, 107, 129, 0.4);
        }

        .footer-credit {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.06);
            font-size: 0.85rem;
            color: #999;
        }

        .dark-mode .footer-credit { border-top-color: rgba(255,255,255,0.06); }
        .dev-link { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>

<body class="light-mode">
    <div class="content">
        <div class="main-image">
            <img src="images/001.png" alt="مدرسة أمير" 
        </div>
   
        <h2>أوووه! لقد احترقت الوصفة</h2>
        <p>يبدو أنك ضللت الطريق. الصفحة التي تبحث عنها غير موجودة في مطبخنا حالياً.</p>
        
        <a href="https://amirdelices.pages.dev/" class="btn-home">
            <i class="fa-solid fa-house-chimney"></i> العودة للرئيسية
        </a>

        <div class="footer-credit">
            بواسطة: <a href="https://fennecvisionary.vercel.app/DevProfile.html" class="dev-link">Bradai Abderrahmen</a>
        </div>
    </div>

    <script>
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark' || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem('theme'))) {
            body.classList.remove('light-mode');
            body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
