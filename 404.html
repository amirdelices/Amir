<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style404.css">
    <title>404 - الصفحة غير موجودة</title>
    <style>
        :root {
            --primary-color: #e56075;
            --light-bg-color: #ffe5ee;
            --light-text-color: #333;
            --light-card-bg: #ffffff;
            --light-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            --dark-bg-color: #1a1a1a;
            --dark-text-color: #f8f9fa;
            --dark-card-bg: #2d2d2d;
            --dark-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--light-bg-color);
            color: var(--light-text-color);
            text-align: center;
            flex-direction: column;
            transition: background-color 0.5s ease, color 0.5s ease;
            padding: 1rem;
        }

        body.dark-mode {
            background-color: var(--dark-bg-color);
            color: var(--dark-text-color);
        }

        .content {
            background-color: var(--light-card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--light-shadow);
            transition: all 0.5s ease;
            max-width: 500px;
            width: 100%;
        }

        .dark-mode .content {
            background-color: var(--dark-card-bg);
            box-shadow: var(--dark-shadow);
        }

        /* استبدال الـ GIF بأيقونة أو صورة كبيرة */
        .error-icon {
            display: block;
            margin: 1rem auto;
        }

        .error-icon img {
            width: 100%;
            max-width: 500px; /* الحد الأقصى للحجم على الشاشات الكبيرة */
            height: auto;
            object-fit: contain;
            border-radius: 10px;
        }

        .text {
            margin: 1.5rem 0;
        }

        .text h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .text p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin: 0;
        }

        button {
            display: inline-block;
            margin-top: 2rem;
            padding: 12px 35px;
            background-color: var(--primary-color);
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.3s ease, background-color 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: #e56075;
            transform: translateY(-3px);
        }

        .footer-link {
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        .code-link {
            color: orange;
            text-decoration: none;
            font-weight: bold;
        }

        .code-link:hover {
            text-decoration: underline;
        }

        /* ======== تجاوبية الهواتف ======== */
        @media screen and (max-width: 768px) {
            .content {
                padding: 1.5rem;
            }

            .error-icon img {
                max-width: 100%;
            }

            .text h2 {
                font-size: 1.5rem;
            }

            .text p {
                font-size: 1rem;
            }

            button {
                padding: 10px 25px;
                font-size: 0.9rem;
            }
        }

        @media screen and (max-width: 480px) {
            .text h2 {
                font-size: 1.3rem;
            }

            .text p {
                font-size: 0.95rem;
            }

            button {
                padding: 8px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body class="light-mode">
    <div class="content">
        <!-- استبدال الإيموجي بصورة -->
        <span class="error-icon">
            <img src="images/001.png" alt="Error Icon">
        </span>

        <div class="text">
            <h2>يبدو أنك ضللت الطريق</h2>
            <p>الصفحة التي تبحث عنها غير موجودة في مطبخنا حالياً.</p>
            
            <button onclick="window.location.href='https://amirdelices.pages.dev/'">العودة للرئيسية</button>
        </div>

        <div class="footer-link">
            بواسطة: 
            <a href="https://fennecvisionary.vercel.app/DevProfile.html" class="code-link">🦊 Bradai Abderrahmen</a>
        </div>
    </div>

    <script>
        // التحقق من الوضع الليلي
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
        }
    </script>
</body>

</html>
